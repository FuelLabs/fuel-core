[advisories]
ignore = [
    "RUSTSEC-2026-0118", # hickory-proto 0.25 via libp2p-dns 0.44; advisory has no fixed release
    "RUSTSEC-2026-0119", # https://github.com/FuelLabs/fuel-core/issues/3296 — libp2p-dns 0.44 pins hickory-proto 0.25
    # Thrift 0.17 is only used by parquet 58.1.0. Its file readers use the
    # compact protocol, not the affected TBinaryInputProtocol::read_bytes/read_string.
    # Reassess if another Thrift consumer or binary-protocol reader is introduced.
    "RUSTSEC-2026-0435",
    # Temporary risk acceptance: crypto-bigint 0.5.5 is required by
    # elliptic-curve 0.13 (via fuel-crypto, Alloy, and libp2p) and aws-sigv4.
    # The advisory's fix starts at 0.7.6, outside those dependency requirements.
    # Signing paths include secret arithmetic: this exception does not fix the
    # timing side channel or establish that our usage is unaffected.
    # Upstream blocker: https://github.com/alloy-rs/alloy/issues/4445
    # Upstream precedent: https://github.com/alloy-rs/alloy/pull/4456
    # https://github.com/alloy-rs/core/pull/1242
    # https://github.com/worldcoin/bedrock/pull/489
    # Review before the next release, no later than 2026-12-03. Remove once
    # upstream backports or dependency migrations eliminate affected versions.
    "RUSTSEC-2026-0387",
]
