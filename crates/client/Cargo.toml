[package]
name = "fuel-core-client"
version = { workspace = true }
authors = { workspace = true }
categories = ["concurrency", "cryptography::cryptocurrencies", "emulators"]
edition = { workspace = true }
homepage = { workspace = true }
keywords = ["blockchain", "cryptocurrencies", "fuel-vm", "vm"]
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
description = "Tx client and schema specification."

[features]
std = ["fuel-core-types/std"]
default = ["subscriptions", "std"]
rpc = [
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:flate2",
    "dep:fuel-core-block-aggregator-api",
    "dep:prost",
    "dep:tonic",
    "dep:tokio",
]
test-helpers = []
subscriptions = [
    "base64",
    "bytes",
    "eventsource-client",
    "futures",
    "launchdarkly-sdk-transport",
    "dep:postcard",
    "fuel-core-types/serde",
]
fault-proving = ["fuel-core-types/fault-proving"]

[dependencies]
anyhow = { workspace = true }
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
base64 = { version = "0.22.1", optional = true }
bytes = { workspace = true, optional = true }
cynic = { workspace = true }
derive_more = { workspace = true }
eventsource-client = { version = "0.17.0", default-features = false, optional = true }
flate2 = { workspace = true, optional = true }
fuel-core-block-aggregator-api = { workspace = true, optional = true }
fuel-core-types = { workspace = true, features = ["alloc", "serde"] }
futures = { workspace = true, optional = true }
hex = { workspace = true }
itertools = { workspace = true }
launchdarkly-sdk-transport = { version = "0.1.4", default-features = false, optional = true }
postcard = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
# We force the version because 4.1.0 update leap seconds that breaks our timestamps
tai64 = { version = "=4.0.0", features = ["serde"] }
thiserror = "1.0"
tokio = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = "0.1"

[build-dependencies]
schemafy_lib = { version = "0.5" }
serde_json = { version = "1.0", features = ["raw_value"] }

[dev-dependencies]
fuel-core-types = { workspace = true, features = ["serde", "std", "test-helpers"] }
insta = { workspace = true }
